<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map – DB Delay Explorer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="map-page">
    <header class="map-header">
        <h1>DB Delay Explorer</h1>
        <p id="map-title" class="map-title">Loading…</p>
        <a id="change-selection" class="button-link" href="index.html">Change selection</a>
    </header>
    <p id="map-status" class="status" hidden></p>
    <div id="map" class="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script type="module" src="js/map.js"></script>
</body>
</html>
